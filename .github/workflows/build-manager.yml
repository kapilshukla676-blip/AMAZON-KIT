name: Build Manager

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  packages: read

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    with:
      package_name: com.amazon.mShop.android.shopping
      expected_hash: c82ff658b65301f53d13c65204f8e4ef6f842974d06f0236da18ea6dd129adf8
      expected_size: "0x37e"
    secrets: inherit

  build-xx-lkm:
    uses: ./.github/workflows/build-xx-lkm.yml
    with:
      package_name: com.amazon.mShop.android.shopping
      expected_hash: c82ff658b65301f53d13c65204f8e4ef6f842974d06f0236da18ea6dd129adf8
      expected_size: "0x37e"
    secrets: inherit

  build-manager:
    needs: [build-lkm, build-xx-lkm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > manager/app/amazon.keystore

      - name: Build APK
        run: |
          cd manager
          ./gradlew assembleRelease \
            -PKSU_PACKAGE_NAME=com.amazon.mShop.android.shopping \
            -PKSU_EXPECTED_HASH=c82ff658b65301f53d13c65204f8e4ef6f842974d06f0236da18ea6dd129adf8 \
            -PKSU_EXPECTED_SIZE=0x37e \
            -Pandroid.injected.signing.store.file=app/amazon.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amazon-Manager-APK
          path: manager/app/build/outputs/apk/release/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Amazon Manager v${{ github.run_number }}"
          files: manager/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
